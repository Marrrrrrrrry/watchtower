version: 2

project_name: watchtower

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: watchtower-linux-amd64
    main: ./main.go
    binary: watchtower
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w -X github.com/Marrrrrrrrry/watchtower/internal/meta.Version={{.Version}}
  - id: watchtower-linux-386
    main: ./main.go
    binary: watchtower
    goos:
      - linux
    goarch:
      - 386
    ldflags:
      - -s -w -X github.com/Marrrrrrrrry/watchtower/internal/meta.Version={{.Version}}
  - id: watchtower-linux-armv7
    main: ./main.go
    binary: watchtower
    goos:
      - linux
    goarch:
      - arm
    goarm:
      - 7
    ldflags:
      - -s -w -X github.com/Marrrrrrrrry/watchtower/internal/meta.Version={{.Version}}
  - id: watchtower-linux-arm64
    main: ./main.go
    binary: watchtower
    goos:
      - linux
    goarch:
      - arm64
    ldflags:
      - -s -w -X github.com/Marrrrrrrrry/watchtower/internal/meta.Version={{.Version}}
  - id: watchtower-windows-amd64
    main: ./main.go
    binary: watchtower
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -s -w -X github.com/Marrrrrrrrry/watchtower/internal/meta.Version={{.Version}}

release:
  github:
    owner: marrrrrrrrry
    name: watchtower
  draft: false
  prerelease: auto
archives:
  - name_template: >-
      {{- .ProjectName }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "arm" }}armhf
      {{- else if eq .Arch "arm64" }}arm64v8
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE.md
dockers_v2:
  - id: watchtower
    dockerfile: dockerfiles/Dockerfile
    ids:
      - watchtower-linux-amd64
      - watchtower-linux-386
      - watchtower-linux-armv7
      - watchtower-linux-arm64
    images:
      - marrrrrrrrry/watchtower
      - ghcr.io/marrrrrrrrry/watchtower
    tags:
      - "{{ .Tag }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/386
      - linux/arm/v7
      - linux/arm64
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
    sbom: false

retry:
  attempts: 5
  delay: 10s
  max_delay: 1m
